name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - name: Build version-independent release asset
        run: |
          mkdir -p release
          pnpm pack --pack-destination release
          mv release/f1star-dsh-research-*.tgz release/dsh-research.tgz
      - name: Extract version release notes
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$RELEASE_VERSION" = "v$version"
          awk -v version="$version" '
            ($0 == "## " version || index($0, "## " version " - ") == 1) { found = 1; next }
            found && /^## / { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/dsh-research.tgz --verify-tag --fail-on-no-commits --notes-file release-notes.md --title "$GITHUB_REF_NAME"
